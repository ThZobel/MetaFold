    <!-- CRITICAL: Layout override to force full width -->

    <link rel="stylesheet" href="css/sticky-actions.css">

<body>
    <div class="container">

        <!-- LEFT SIDEBAR - Template Selection (PRESERVED EXACTLY) -->
        <div id="left-sidebar-container" class="sidebar"></div>

        <!-- RIGHT MAIN CONTENT - Enhanced with JSONCrack Integration -->
        <div class="main-content">
            <div class="header">
                <h1>🚀 Project Manager</h1>
                <p>Create, manage and visualize your project templates</p>
            </div>

            <!-- Main Content Tabs (PRESERVED) -->
            <div class="main-tabs">
                <button class="main-tab active" onclick="switchMainTab('create')" id="createTab">
                    🎯 Create Project
                </button>
                <button class="main-tab" onclick="switchMainTab('discover')" id="discoverTab">
                    📁 Discover Projects
                </button>
                <!-- Temporary inactivated
                <button class="main-tab" onclick="switchMainTab('visualize')" id="visualizeTab">
                    📊 Visualize Data
                </button>
                -->
            </div>

            <!-- Scrollable Content Wrapper -->
            <div class="main-content-wrapper">

                <!-- CREATE PROJECT TAB (PRESERVED EXACTLY FROM WORKING VERSION) -->
                <div id="createTabContent" class="main-tab-content active"></div>

                <!-- PROJECT DISCOVERY TAB -->
                <div id="discoverTabContent" class="main-tab-content"></div>

                <!-- ENHANCED: VISUALIZE TAB with JSONCrack Integration -->
                <div id="visualizeTabContent" class="main-tab-content"></div>

            </div>
            <!-- Ende: main-content-wrapper -->

            <!-- Fixed Footer mit Actions und Messages -->
            <div class="main-content-footer">
                <!-- Actions Container -->
                <div class="footer-actions-container" id="footerActionsContainer">
                    <!-- ENHANCED ACTIONS SECTION - MIT Clear & Save Buttons -->
                    <div class="actions">
                        <button id="createProjectBtn" class="btn" onclick="createProject()">🎯 Create
                            Project</button>

                        <!-- NEW: Send to Integrations Button (Initially Hidden) -->
                        <button id="sendToIntegrationsBtn" class="btn btn-primary"
                            onclick="metadataLoader.sendMetadata()"
                            style="display: none; background: linear-gradient(135deg, #059669, #047857);">
                            🚀 Send to Integrations
                        </button>

                        <button id="editTemplateBtn" class="btn btn-secondary" onclick="editCurrentTemplate()">✏️
                            Edit</button>

                        <!-- Moved from experimentForm: Clear & Save Buttons -->
                        <button id="clearTemplateBtn" class="btn btn-secondary btn-small"
                            onclick="showTemplateActionsMenu()"
                            style="padding: 8px 16px; background: #ef4444; border-color: #ef4444; color: white;"
                            title="Clear template values or form inputs">
                            🧹 Clear
                        </button>

                        <button id="saveTemplateBtn" class="btn btn-primary btn-small"
                            onclick="saveExperimentTemplate()"
                            style="padding: 8px 16px; background: #059669; border-color: #059669; color: white; font-weight: 500;"
                            title="Save current metadata values and project paths with this template">
                            💾 Save Template & Paths
                        </button>
                    </div>
                </div>

                <!-- Messages Container -->
                <div class="footer-messages-container" id="footerMessagesContainer">
                    <!-- Info Message for additional information -->
                    <div id="infoMessage" class="message info-message" style="display: none;"></div>
                    <div id="successMessage" class="success-message" style="display: none;"></div>
                    <div id="errorMessage" class="error-message" style="display: none;"></div>
                </div>
            </div>
            <!-- Ende: main-content-footer -->



            <!-- Ende: main-content (enthält alle Tabs + Footer) -->

        </div>

        <!-- RIGHT SIDEBAR - Integrations & Info -->
        <div id="right-sidebar-container" class="right-sidebar"></div>

        <script src="js/omero/omeroUIIntegration.js"></script>

        <script src="js/omero/metaFoldOMEROIntegration.js"></script>

        <!-- FACET SEARCH MODAL CONTAINER -->
