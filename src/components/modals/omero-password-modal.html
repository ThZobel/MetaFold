<div id="omero-password-modal" class="modal omero-password-modal" style="display: none;">
    <div class="modal-content omero-password-modal-content">
        <div class="modal-header omero-password-modal-header">
            <h2>🔐 OMERO Login</h2>
            <span class="close omero-password-modal-close">&times;</span>
        </div>
        <div class="modal-body omero-password-modal-body">
            <p>Please enter your OMERO password:</p>

            <div class="form-group">
                <label>Username:</label>
                <input type="text" id="omero-modal-username" readonly class="form-control omero-readonly-input">
            </div>

            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="omero-modal-password" class="form-control omero-password-input"
                    placeholder="Enter OMERO password..." autocomplete="off">
            </div>

            <div class="checkbox-group omero-remember-checkbox">
                <input type="checkbox" id="omero-modal-remember-session" checked>
                <label for="omero-modal-remember-session">
                    Remember for this session
                </label>
            </div>

            <div id="omero-modal-error" class="error-message omero-error-message" style="display: none;"></div>
        </div>
        <div class="modal-footer omero-password-modal-footer">
            <button id="omero-modal-cancel" class="btn btn-secondary">
                Cancel
            </button>
            <button id="omero-modal-login" class="btn btn-primary">
                Login
            </button>
        </div>
    </div>
</div>
