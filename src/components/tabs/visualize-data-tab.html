<div class="visualization-container">
    <div class="visualization-header" style="flex-direction: column; align-items: stretch; gap: 10px; padding: 12px 18px;">
        <!-- Row 1: Unified Title, Context Subtitle & Global Data/Export Actions -->
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;">
            <div style="display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0;">
                <h3 style="margin: 0; color: #e0e0e0; font-size: 1.05rem; white-space: nowrap;">📊 Data Visualization</h3>
                <span id="vizSubtitle" style="color: #9ca3af; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Explore your experiment metadata &amp; project lineage</span>
            </div>
            <div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">
                <button class="btn btn-secondary btn-small" onclick="visualizationManager.loadFromTemplate()" title="Visualize current template metadata">
                    🧪 Template
                </button>
                <button class="btn btn-secondary btn-small" onclick="visualizationManager.loadFromScannedProjects()" title="Visualize discovered projects" id="visualizeScannedBtn" style="display: none;">
                    📁 Scanned
                </button>
                <button class="btn btn-secondary btn-small" onclick="visualizationManager.loadFromFile()" title="Load JSON file for visualization">
                    📂 Load JSON
                </button>
                <button class="btn btn-secondary btn-small" onclick="visualizationManager.copyToClipboard()" title="Copy JSON to clipboard">
                    📋 Copy
                </button>
                <button class="btn btn-secondary btn-small" onclick="visualizationManager.exportVisualization()" title="Export current visualization">
                    💾 Export
                </button>
            </div>
        </div>

        <!-- Row 2: View Switcher + Context-Specific Controls in One Bar -->
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.08);">
            <div class="visualization-type-selector" style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">
                <button class="viz-type-btn active" onclick="visualizationManager.setVisualizationType('mermaidlineage')" id="mermaidlineageTypeBtn" title="Interactive clickable Mermaid project lineage flowchart">
                    🕸️ Lineage Graph
                </button>
                <button class="viz-type-btn" onclick="visualizationManager.setVisualizationType('knowledgegraph')" id="knowledgegraphTypeBtn" title="Knowledge Graph &amp; Lineage Tree views">
                    🌌 Knowledge Graph
                </button>
                <button class="viz-type-btn" onclick="visualizationManager.setVisualizationType('dashboard')" id="dashboardTypeBtn" title="Metadata Analytics Dashboard">
                    📊 D3 Dashboard
                </button>
                <button class="viz-type-btn" onclick="visualizationManager.setVisualizationType('tree')" id="treeTypeBtn" title="Collapsible JSON Tree View">
                    🌳 JSON Tree
                </button>
            </div>

            <div id="vizContextBar" style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                <!-- Knowledge Graph Mode Dropdown (includes Lineage Tree) -->
                <div id="kg-view-selector-wrap" style="display: flex; align-items: center; gap: 6px;">
                    <select id="kg-view-selector" class="form-control" style="background: #262638; color: #f3f4f6; border: 1px solid rgba(139,92,246,0.35); border-radius: 5px; padding: 4px 10px; font-size: 12px; cursor: pointer; outline: none;">
                        <option value="bundling">Combined Graph (Edge Bundling)</option>
                        <option value="tree">Project Structure (Folder Hierarchy)</option>
                        <option value="arc">Chronological Lineage (Arc Diagram)</option>
                        <option value="lineagetree">🌱 Lineage Tree (Collapsible D3)</option>
                    </select>
                </div>

                <!-- Mermaid Lineage Controls -->
                <div id="mermaid-lineage-controls" style="display: none; align-items: center; gap: 8px; flex-wrap: wrap;">
                    <select id="mermaidRootSelect" class="form-control" title="Select root project for lineage graph" style="max-width: 210px; background: #262638; color: #f3f4f6; border: 1px solid rgba(139,92,246,0.35); border-radius: 5px; padding: 4px 8px; font-size: 12px; cursor: pointer; outline: none;"></select>
                    <select id="mermaidScopeSelect" class="form-control" title="Lineage depth scope" style="background: #262638; color: #f3f4f6; border: 1px solid rgba(255,255,255,0.18); border-radius: 5px; padding: 4px 8px; font-size: 12px; cursor: pointer; outline: none;">
                        <option value="direct">Direct Lineage</option>
                        <option value="full">Full Connected Graph</option>
                    </select>
                    <label style="display: flex; align-items: center; gap: 4px; color: #7dd3fc; font-size: 12px; cursor: pointer; user-select: none;">
                        <input type="checkbox" id="mermaidRelatedToggle" checked>
                        🔀 Related
                    </label>
                </div>

                <!-- Tree Expand/Collapse (shown for KG tree mode) -->
                <div id="kg-tree-actions" style="display: none; gap: 5px;">
                    <button id="kg-btn-expand" class="btn btn-sm btn-secondary" style="padding: 3px 8px; font-size: 12px;">Expand All</button>
                    <button id="kg-btn-collapse" class="btn btn-sm btn-secondary" style="padding: 3px 8px; font-size: 12px;">Collapse All</button>
                </div>

                <!-- Dynamic Selection Actions (KG / LineageTree) -->
                <div id="kg-action-bar" style="display: flex; gap: 6px; align-items: center;"></div>
                <div id="lineage-action-bar" style="display: flex; gap: 6px; align-items: center;"></div>
                <div id="kgLegend" style="display: flex; gap: 8px; font-size: 11px; color: #9ca3af;"></div>

                <label id="showFolderLinksLabel" style="display: flex; align-items: center; gap: 5px; color: #e0e0e0; font-size: 12px; cursor: pointer; user-select: none;">
                    <input type="checkbox" id="showFolderLinksToggle" onchange="if(window.visualizationManager && window.visualizationManager.currentData) window.visualizationManager.renderVisualization(window.visualizationManager.currentData)">
                    📁 Ordner-Beziehungen
                </label>
            </div>
        </div>
    </div>

    <div class="visualization-main" style="display: flex; flex: 1; overflow: hidden;">
        <!-- Left Sidebar for Active Filters -->
        <div id="vizSidebar" class="visualization-sidebar" style="display: none; width: 250px; background: rgba(30,30,46,0.95); border-right: 1px solid rgba(255,255,255,0.1); padding: 15px; overflow-y: auto;">
            <h4 style="margin: 0 0 15px 0; color: #e0e0e0; font-size: 14px; display: flex; align-items: center; justify-content: space-between;">
                <span>Active Filters</span>
                <span id="vizFilterCount" style="background: #3b82f6; color: white; padding: 2px 6px; border-radius: 10px; font-size: 11px;">0</span>
            </h4>
            <div id="vizSidebarContent" style="display: flex; flex-direction: column; gap: 10px;">
                <!-- Filter chips injected here -->
            </div>
            <button class="btn btn-secondary btn-small" style="width: 100%; margin-top: 15px;" onclick="window.switchMainTab('discover'); if(window.facetSearch) facetSearch.openModal();">
                Edit Filters
            </button>
            <button class="btn btn-secondary btn-small" style="width: 100%; margin-top: 5px; color: #ef4444; border-color: #ef4444;" onclick="visualizationManager.resetFilters()">
                Reset Filters
            </button>
        </div>

        <!-- Main Content -->
        <div class="visualization-content" id="visualizationContent" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
            <div class="visualization-placeholder">
                <svg fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM7 13.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM12 7.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM17 13.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" />
                </svg>
                <h4>No Data Loaded</h4>
                <p>Select a template or load a JSON file to start visualizing your data</p>
                <div style="margin-top: 20px;">
                    <button class="btn btn-secondary" onclick="visualizationManager.showSampleData()">
                        🎯 Show Sample
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
