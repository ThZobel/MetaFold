name: Build and Release MetaFold

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.0.73, v0.1.0-beta.1) or "auto" to bump latest v0.0.x tag'
        required: true
        default: 'auto'
      release_notes:
        description: 'Highlights: new tools, features, and bug fixes'
        required: false
        default: ''
      create_release:
        description: 'Create GitHub Release after build?'
        required: true
        type: boolean
        default: true

  push:
    tags:
      - 'v*'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.calc.outputs.tag }}
      version: ${{ steps.calc.outputs.version }}
      is_prerelease: ${{ steps.calc.outputs.is_prerelease }}
      make_latest: ${{ steps.calc.outputs.make_latest }}
    steps:
      - name: Checkout tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate release version & flags
        id: calc
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            raw="${{ github.event.inputs.version }}"
          else
            raw="${GITHUB_REF#refs/tags/}"
          fi

          if [ -z "$raw" ] || [ "$raw" == "auto" ]; then
            latest_tag=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
            if [ -z "$latest_tag" ]; then
              raw="v0.0.1"
            else
              IFS='.' read -r maj min pat <<< "${latest_tag#v}"
              raw="v${maj}.${min}.$((pat + 1))"
            fi
          fi

          # Ensure leading 'v' for tag, strip 'v' for package.json semver
          if [[ "$raw" != v* ]]; then
            tag="v${raw}"
          else
            tag="$raw"
          fi
          ver="${tag#v}"

          # Pre-release if version has suffix (e.g. -alpha, -beta, -rc, -test) OR not running on main
          is_pre="false"
          make_latest="true"
          if [[ "$ver" == *-* ]] || { [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.ref_name }}" != "main" ]; }; then
            is_pre="true"
            make_latest="false"
          fi

          echo "Calculated tag=$tag version=$ver prerelease=$is_pre make_latest=$make_latest"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_pre" >> "$GITHUB_OUTPUT"
          echo "make_latest=$make_latest" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: mac

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update package.json version
        working-directory: src
        run: npm --no-git-tag-version version ${{ needs.prepare.outputs.version }} --allow-same-version

      - name: Debug - Check repository structure (Windows)
        if: matrix.platform == 'windows'
        run: |
          echo "=== Repository root ==="
          dir
          echo "=== src directory ==="
          dir src\ 2>nul || echo "src directory not found"
          echo "=== Find package files ==="
          Get-ChildItem -Recurse -Name "package*.json" 2>nul || echo "No package files found"

      - name: Debug - Check repository structure (Unix)
        if: matrix.platform != 'windows'
        run: |
          echo "=== Repository root ==="
          ls -la
          echo "=== src directory ==="
          ls -la src/ || echo "src directory not found"
          echo "=== Find package files ==="
          find . -name "package*.json" -type f

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3-dev \
            libatk-bridge2.0-dev \
            libdrm2 \
            libxcomposite-dev \
            libxdamage-dev \
            libxrandr-dev \
            libgbm-dev \
            libxss1 \
            libasound2-dev \
            libatspi2.0-0 \
            libgtk-3-0

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows'
        run: |
          echo "=== Installing npm dependencies ==="
          npm ci --verbose
        working-directory: src
        shell: pwsh
        continue-on-error: false

      - name: Install dependencies (Unix)
        if: matrix.platform != 'windows'
        run: |
          echo "=== Installing npm dependencies ==="
          npm ci --verbose
        working-directory: src
        continue-on-error: false

      - name: Debug - Check npm setup (Windows)
        if: matrix.platform == 'windows'
        working-directory: src
        run: |
          node --version
          npm --version
          dir node_modules\ 2>nul | Select-Object -First 10 || echo "No node_modules"
          npx webpack --version || echo "webpack not found"
          npx electron-builder --version || echo "electron-builder not found"

      - name: Debug - Check npm setup (Unix)
        if: matrix.platform != 'windows'
        working-directory: src
        run: |
          node --version
          npm --version
          ls -la node_modules/ | head -10 || echo "No node_modules"
          npx webpack --version || echo "webpack not found"
          npx electron-builder --version || echo "electron-builder not found"

      - name: Build for Windows
        if: matrix.platform == 'windows'
        run: |
          echo "=== Building for Windows ==="
          npx electron-builder --win --publish=never
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder

      - name: Build for Windows 7 (Legacy Electron 22)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          echo "=== Building for Windows 7 SP1 (Electron 22.3.27) ==="
          Remove-Item -Path "dist\win-unpacked" -Recurse -Force -ErrorAction SilentlyContinue
          npx electron-builder --win --config electron-builder-win7.json --publish=never
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder

      - name: Build for macOS
        if: matrix.platform == 'mac'
        run: |
          echo "=== Building for macOS ==="
          npx electron-builder --mac --publish=never
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder

      - name: Build for Linux
        if: matrix.platform == 'linux'
        run: |
          echo "=== Building for Linux ==="
          npx electron-builder --linux --publish=never
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder

      - name: Debug - Check build output (Windows)
        if: matrix.platform == 'windows'
        run: |
          dir src\dist\ 2>nul || echo "No dist directory found"
          Get-ChildItem -Path src\dist -Recurse -File 2>nul || echo "No files in dist"

      - name: Debug - Check build output (Unix)
        if: matrix.platform != 'windows'
        run: |
          ls -la src/dist/ || echo "No dist directory found"
          find src/dist -type f -name "*.*" 2>/dev/null || echo "No files in dist"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: metafold-${{ matrix.platform }}
          path: |
            src/dist/*.exe
            src/dist/*.dmg
            src/dist/*.pkg
            src/dist/*.AppImage
            src/dist/*.deb
          retention-days: 5
          if-no-files-found: warn

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: |
      always() && 
      needs.build.result == 'success' &&
      (github.event_name == 'push' || 
       (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Debug - Check downloaded artifacts
        run: |
          find ./artifacts -type f -ls 2>/dev/null || echo "No artifacts found"

      - name: Prepare release body
        id: release_body
        run: |
          cat << 'EOF' > release_body.md
          # MetaFold ${{ needs.prepare.outputs.tag }}

          **Laboratory data management platform for automated folder structures, experiment metadata, and seamless integration with electronic lab notebooks.**

          EOF

          if [ -n "${{ github.event.inputs.release_notes }}" ]; then
            cat << 'EOF' >> release_body.md
          ## ✨ Highlights & Fixes

          ${{ github.event.inputs.release_notes }}

          EOF
          fi

          cat << 'EOF' >> release_body.md
          ## 📥 Downloads

          | Platform | Installer / Package | Notes |
          | :--- | :--- | :--- |
          | **Windows 10/11** | `MetaFold Setup *.exe` | Standard installer |
          | **Windows 7 SP1** | `*-win7.exe` | Legacy build (Electron 22) |
          | **macOS** | `*.dmg` | Drag MetaFold to Applications |
          | **Linux** | `*.AppImage` / `*.deb` | `chmod +x` for AppImage |

          ---

          - **Documentation:** [README](https://github.com/ThZobel/MetaFold/blob/${{ github.ref_name }}/README.md) · [CHANGELOG](https://github.com/ThZobel/MetaFold/blob/${{ github.ref_name }}/CHANGELOG.md) · [SECURITY](https://github.com/ThZobel/MetaFold/blob/${{ github.ref_name }}/SECURITY.md)
          - **Admin User Password:** `admin`
          - **First-time users:** Check out the [example templates](https://github.com/ThZobel/MetaFold/tree/${{ github.ref_name }}/templates)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: MetaFold ${{ needs.prepare.outputs.tag }}
          draft: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease }}
          make_latest: ${{ needs.prepare.outputs.make_latest }}
          generate_release_notes: true
          files: |
            artifacts/**/*
          body_path: release_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
