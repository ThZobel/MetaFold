# .github/workflows/release.yml
name: Build and Release MetaFold

on:
  # Händischer Trigger über GitHub UI  
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.0.3)'
        required: true
        default: 'v0.0.3'
  
  # Automatischer Trigger bei Tag-Push (optional)
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest  
            platform: windows
          - os: macos-latest
            platform: mac

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build visualization (webpack)
        run: npm run build-visualization

      - name: Build for Windows
        if: matrix.platform == 'windows'
        run: npm run build-win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for macOS  
        if: matrix.platform == 'mac'
        run: npm run build-mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Für Code Signing (falls du später willst):
          # CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          # CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}

      - name: Build for Linux
        if: matrix.platform == 'linux'  
        run: npm run build-linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: metafold-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.pkg  
            dist/*.AppImage
            dist/*.deb
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Get version number
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: MetaFold ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          body: |
            # MetaFold ${{ steps.version.outputs.version }}
            
            **Laboratory data management platform for automated folder structures, experiment metadata, and seamless integration with electronic lab notebooks.**
            
            ## 📥 Downloads
            
            Choose the version for your operating system:
            
            ### Windows
            - `MetaFold-Setup-${{ steps.version.outputs.version }}.exe` - Windows Installer
            
            ### macOS  
            - `MetaFold-${{ steps.version.outputs.version }}.dmg` - macOS Disk Image
            
            ### Linux
            - `MetaFold-${{ steps.version.outputs.version }}.AppImage` - Universal Linux AppImage
            - `MetaFold-${{ steps.version.outputs.version }}.deb` - Debian/Ubuntu Package
            
            ## 🚀 Installation
            
            - **Windows**: Run the `.exe` installer
            - **macOS**: Open the `.dmg` and drag MetaFold to Applications  
            - **Linux**: Make the `.AppImage` executable (`chmod +x`) or install the `.deb` package
            
            ## 📖 Documentation
            
            See the [README](https://github.com/ThZobel/MetaFold/blob/main/README.md) for detailed usage instructions.
            
            ---
            
            **Admin User Password:** `admin`  
            **First-time users:** Check out the [example templates](https://github.com/ThZobel/MetaFold/tree/main/templates)

      - name: Upload Release Assets
        run: |
          # Alle Build-Artefakte zu Release hinzufügen
          for dir in artifacts/*/; do
            for file in "$dir"dist/*; do
              if [[ -f "$file" ]]; then
                filename=$(basename "$file")
                echo "Uploading: $filename"
                gh release upload ${{ steps.version.outputs.version }} "$file" --clobber
              fi
            done
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
