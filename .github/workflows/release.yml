# .github/workflows/release.yml
name: Build and Release MetaFold

on:
  # Händischer Trigger über GitHub UI  
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.0.3)'
        required: true
        default: 'v0.0.3'
      release_notes:
        description: 'Release notes (Bug fixes, new features, etc.)'
        required: false
        default: ''
      create_release:
        description: 'Create GitHub Release after build?'
        required: true
        type: boolean
        default: true
  
  # Automatischer Trigger bei Tag-Push (optional)
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest  
            platform: windows
          - os: macos-latest
            platform: mac

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Debug: Check file structure (Windows)
      - name: Debug - Check repository structure (Windows)
        if: matrix.platform == 'windows'
        run: |
          echo "=== Repository root ==="
          dir
          echo "=== src directory ==="
          dir src\ 2>nul || echo "src directory not found"
          echo "=== Find package files ==="
          Get-ChildItem -Recurse -Name "package*.json" 2>nul || echo "No package files found"

      # Debug: Check file structure (Unix-like)
      - name: Debug - Check repository structure (Unix)
        if: matrix.platform != 'windows'
        run: |
          echo "=== Repository root ==="
          ls -la
          echo "=== src directory ==="
          ls -la src/ || echo "src directory not found"
          echo "=== Find package files ==="
          find . -name "package*.json" -type f

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      # Linux specific dependencies
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3-dev \
            libatk-bridge2.0-dev \
            libdrm2 \
            libxcomposite-dev \
            libxdamage-dev \
            libxrandr-dev \
            libgbm-dev \
            libxss1 \
            libasound2-dev \
            libatspi2.0-0 \
            libgtk-3-0

      # WICHTIG: Dependencies ZUERST installieren!
      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows'
        run: |
          echo "=== Installing npm dependencies ==="
          npm ci --verbose
          echo "=== Post-install verification ==="
          echo "Checking if webpack was installed..."
          if (Test-Path "node_modules\.bin\webpack.cmd") { 
            echo "✅ webpack.cmd found in node_modules\.bin\"
          } else { 
            echo "❌ webpack.cmd NOT found - installing webpack-cli"
            npm install webpack webpack-cli --save-dev
          }
        working-directory: src
        shell: pwsh
        continue-on-error: false

      - name: Install dependencies (Unix)
        if: matrix.platform != 'windows'
        run: |
          echo "=== Installing npm dependencies ==="
          npm ci --verbose
          echo "=== Post-install verification ==="
          echo "Checking if webpack was installed..."
          if [ -f "node_modules/.bin/webpack" ]; then
            echo "✅ webpack found in node_modules/.bin/"
          else
            echo "❌ webpack NOT found - installing webpack-cli"
            npm install webpack webpack-cli --save-dev
          fi
        working-directory: src
        continue-on-error: false

      # Debug NACH der Installation
      - name: Debug - Check npm setup (Windows)
        if: matrix.platform == 'windows'
        working-directory: src
        run: |
          echo "=== Node and NPM versions ==="
          node --version
          npm --version
          echo "=== Checking node_modules ==="
          dir node_modules\ 2>nul | Select-Object -First 10 || echo "No node_modules"
          echo "=== Checking webpack ==="
          npx webpack --version || echo "webpack not found"
          echo "=== Checking electron-builder ==="
          npx electron-builder --version || echo "electron-builder not found"

      - name: Debug - Check npm setup (Unix)
        if: matrix.platform != 'windows'
        working-directory: src
        run: |
          echo "=== Node and NPM versions ==="
          node --version
          npm --version
          echo "=== Checking node_modules ==="
          ls -la node_modules/ | head -10 || echo "No node_modules"
          echo "=== Checking webpack ==="
          npx webpack --version || echo "webpack not found"
          echo "=== Checking electron-builder ==="
          npx electron-builder --version || echo "electron-builder not found"

      - name: Build visualization (webpack)
        run: |
          echo "=== Building visualization ==="
          npx webpack --mode=production
        working-directory: src
        continue-on-error: false

      - name: Build for Windows
        if: matrix.platform == 'windows'
        run: |
          echo "=== Building for Windows ==="
          npx electron-builder --win --publish=never
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder

      - name: Build for macOS  
        if: matrix.platform == 'mac'
        run: |
          echo "=== Building for macOS ==="
          npx electron-builder --mac --publish=never
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder

      - name: Build for Linux
        if: matrix.platform == 'linux'  
        run: |
          echo "=== Building for Linux ==="
          npx electron-builder --linux --publish=never
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder

      # Debug: Check what was built (Windows)
      - name: Debug - Check build output (Windows)
        if: matrix.platform == 'windows'
        run: |
          echo "=== Build output ==="
          dir src\dist\ 2>nul || echo "No dist directory found"
          Get-ChildItem -Path src\dist -Recurse -File 2>nul || echo "No files in dist"

      # Debug: Check what was built (Unix)
      - name: Debug - Check build output (Unix)
        if: matrix.platform != 'windows'
        run: |
          echo "=== Build output ==="
          ls -la src/dist/ || echo "No dist directory found"
          find src/dist -type f -name "*.*" 2>/dev/null || echo "No files in dist"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: metafold-${{ matrix.platform }}
          path: |
            src/dist/*.exe
            src/dist/*.dmg
            src/dist/*.pkg
            src/dist/*.AppImage
            src/dist/*.deb
          retention-days: 5
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    # Läuft wenn: Tag-Push ODER (workflow_dispatch UND create_release=true)
    if: |
      always() && 
      needs.build.result == 'success' &&
      (github.event_name == 'push' || 
       (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'))
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Debug - Check downloaded artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          find ./artifacts -type f -ls 2>/dev/null || echo "No artifacts found"

      - name: Get version number
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Prepare release body
        id: release_body
        run: |
          cat << 'EOF' > release_body.md
          # MetaFold ${{ steps.version.outputs.version }}
          
          **Laboratory data management platform for automated folder structures, experiment metadata, and seamless integration with electronic lab notebooks.**
          
          EOF
          
          if [ -n "${{ github.event.inputs.release_notes }}" ]; then
            echo "" >> release_body.md
            echo "## 📝 Release Notes" >> release_body.md
            echo "" >> release_body.md
            echo "${{ github.event.inputs.release_notes }}" >> release_body.md
            echo "" >> release_body.md
          fi
          
          cat << 'EOF' >> release_body.md
          ## 📥 Downloads
          
          Choose the version for your operating system:
          
          ### Windows
          - `*.exe` - Windows Installer
          
          ### macOS  
          - `*.dmg` - macOS Disk Image
          
          ### Linux
          - `*.AppImage` - Universal Linux AppImage
          - `*.deb` - Debian/Ubuntu Package
          
          ## 🚀 Installation
          
          - **Windows**: Run the `.exe` installer
          - **macOS**: Open the `.dmg` and drag MetaFold to Applications  
          - **Linux**: Make the `.AppImage` executable (`chmod +x`) or install the `.deb` package
          
          ## 📖 Documentation
          
          See the [README](https://github.com/ThZobel/MetaFold/blob/main/README.md) for detailed usage instructions.
          
          ---
          
          **Admin User Password:** `admin`  
          **First-time users:** Check out the [example templates](https://github.com/ThZobel/MetaFold/tree/main/templates)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: MetaFold ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*
          body_path: release_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}