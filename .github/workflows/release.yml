name: Build and Release Electron App

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Test job first
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Check out Git repository
      uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'src/package-lock.json'

    - name: Install dependencies
      working-directory: src
      run: npm ci

    - name: Run tests
      working-directory: src
      run: npm test || echo "No tests defined"

    - name: Run linting
      working-directory: src
      run: npm run lint || echo "No linting defined"

  # Build job
  build:
    needs: test
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            command: build-win
            artifact_name: MetaFold-Windows
            artifact_path: 'src/dist/*.exe'
          - os: macos-13  # Intel macOS
            platform: mac-intel
            command: build-mac
            artifact_name: MetaFold-macOS-Intel
            artifact_path: 'src/dist/*.dmg'
          - os: macos-14  # ARM macOS (M1/M2)
            platform: mac-arm
            command: build-mac
            artifact_name: MetaFold-macOS-ARM
            artifact_path: 'src/dist/*.dmg'
          - os: ubuntu-latest
            platform: linux
            command: build-linux
            artifact_name: MetaFold-Linux
            artifact_path: 'src/dist/*.AppImage'

    steps:
    - name: Check out Git repository
      uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'src/package-lock.json'

    # Windows specific setup
    - name: Prepare for app notarization (Windows)
      if: matrix.platform == 'windows'
      run: |
        echo "Windows code signing would go here"

    # macOS specific setup  
    - name: Prepare for app notarization (macOS)
      if: startsWith(matrix.platform, 'mac')
      run: |
        echo "macOS notarization setup would go here"
        # Add certificates, etc.

    # Linux specific setup
    - name: Install Linux dependencies
      if: matrix.platform == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libnss3-dev libatk-bridge2.0-dev libdrm2 libxcomposite-dev libxdamage-dev libxrandr-dev libgbm-dev libxss1 libasound2-dev

    - name: Install dependencies
      working-directory: src
      run: npm ci

    - name: Build Electron app
      working-directory: src
      run: npm run ${{ matrix.command }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_path }}
        retention-days: 30

  # Release job (only on release events)
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Display structure of downloaded files
      run: ls -la artifacts/

    - name: Release to GitHub
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/MetaFold-Windows/*
          artifacts/MetaFold-macOS-Intel/*
          artifacts/MetaFold-macOS-ARM/*
          artifacts/MetaFold-Linux/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Auto-release job (on push to main)
  auto-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Check out Git repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Get package version
      id: package-version
      working-directory: src
      run: |
        VERSION=$(node -p "require('./package.json').version")
        echo "version=v$VERSION" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.package-version.outputs.version }}
        name: Release ${{ steps.package-version.outputs.version }}
        files: |
          artifacts/MetaFold-Windows/*
          artifacts/MetaFold-macOS-Intel/*
          artifacts/MetaFold-macOS-ARM/*
          artifacts/MetaFold-Linux/*
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/MetaFold-Windows/*
          artifacts/MetaFold-macOS/*
          artifacts/MetaFold-Linux/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
