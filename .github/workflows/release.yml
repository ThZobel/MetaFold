# .github/workflows/release.yml
name: Build and Release MetaFold

on:
  # Händischer Trigger über GitHub UI  
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.0.3)'
        required: true
        default: 'v0.0.3'
  
  # Automatischer Trigger bei Tag-Push (optional)
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false  # Wichtig: Verhindert Abbruch bei einem Fehler
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest  
            platform: windows
          - os: macos-latest
            platform: mac

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Debug: Check file structure
      - name: Debug - Check repository structure
        run: |
          echo "=== Repository root ==="
          ls -la
          echo "=== src directory ==="
          ls -la src/ || echo "src directory not found"
          echo "=== Find package files ==="
          find . -name "package*.json" -type f

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # Updated to Node 20
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      # Linux specific dependencies
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3-dev \
            libatk-bridge2.0-dev \
            libdrm2 \
            libxcomposite-dev \
            libxdamage-dev \
            libxrandr-dev \
            libgbm-dev \
            libxss1 \
            libasound2-dev \
            libatspi2.0-0 \
            libgtk-3-0

      - name: Install dependencies
        run: |
          echo "=== Installing npm dependencies ==="
          npm ci --verbose
        working-directory: src

      - name: Build visualization (webpack)
        run: |
          echo "=== Building visualization ==="
          npm run build-visualization
        working-directory: src

      - name: Build for Windows
        if: matrix.platform == 'windows'
        run: |
          echo "=== Building for Windows ==="
          npm run build-win
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for macOS  
        if: matrix.platform == 'mac'
        run: |
          echo "=== Building for macOS ==="
          npm run build-mac
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Für Code Signing (falls du später willst):
          # CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          # CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}

      - name: Build for Linux
        if: matrix.platform == 'linux'  
        run: |
          echo "=== Building for Linux ==="
          npm run build-linux
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Debug: Check what was built
      - name: Debug - Check build output
        run: |
          echo "=== Build output ==="
          ls -la src/dist/ || echo "No dist directory found"
          find src/dist -type f -name "*.*" 2>/dev/null || echo "No files in dist"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: metafold-${{ matrix.platform }}
          path: |
            src/dist/*.exe
            src/dist/*.dmg
            src/dist/*.pkg
            src/dist/*.AppImage
            src/dist/*.deb
          retention-days: 5
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Debug - Check downloaded artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          find ./artifacts -type f -ls || echo "No artifacts found"

      - name: Get version number
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1  # Updated to modern action
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: MetaFold ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*
          body: |
            # MetaFold ${{ steps.version.outputs.version }}
            
            **Laboratory data management platform for automated folder structures, experiment metadata, and seamless integration with electronic lab notebooks.**
            
            ## 📥 Downloads
            
            Choose the version for your operating system:
            
            ### Windows
            - `*.exe` - Windows Installer
            
            ### macOS  
            - `*.dmg` - macOS Disk Image
            
            ### Linux
            - `*.AppImage` - Universal Linux AppImage
            - `*.deb` - Debian/Ubuntu Package
            
            ## 🚀 Installation
            
            - **Windows**: Run the `.exe` installer
            - **macOS**: Open the `.dmg` and drag MetaFold to Applications  
            - **Linux**: Make the `.AppImage` executable (`chmod +x`) or install the `.deb` package
            
            ## 📖 Documentation
            
            See the [README](https://github.com/ThZobel/MetaFold/blob/main/README.md) for detailed usage instructions.
            
            ---
            
            **Admin User Password:** `admin`  
            **First-time users:** Check out the [example templates](https://github.com/ThZobel/MetaFold/tree/main/templates)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
